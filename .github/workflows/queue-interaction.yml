name: Desktop interface tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run build
      - name: Exercise the desktop interface with real Electron and backend
        run: LAD_PYTHON="$(python -c 'import sys; print(sys.executable)')" npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: queue-failure-${{ matrix.platform }}
          path: work/ui-test-results
