name: Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.22.3 pytest pytest-asyncio
      - run: npm run build
      - run: python -m pytest tests -q
      - run: node --test tests/*.test.cjs
      - name: Build standalone catalog service
        run: python -m PyInstaller --noconfirm --clean --name lad-backend --distpath build/backend --workpath build/pyinstaller --specpath build --paths backend --collect-all yandex_music --collect-all zeroconf --collect-all certifi backend/app.py
      - name: Build installer and portable archive
        run: npm exec electron-builder -- --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lad-Windows-x64
          path: |
            apps/windows/release/*.exe
            apps/windows/release/*.zip
          if-no-files-found: error
          retention-days: 14
